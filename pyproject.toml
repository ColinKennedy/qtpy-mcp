[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtpy-mcp"
dynamic = ["version"]
description = "MCP server to inspect, screenshot, GIF-record and drive Qt apps and DCCs (Houdini, Blender, ...) through Qt.py."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "qtpy-mcp contributors" }]
keywords = ["mcp", "qt", "qt.py", "pyside", "pyqt", "houdini", "blender", "screenshot", "gif", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "Qt.py>=1.3.8",
    "mcp>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Standalone use only. Inside a DCC the host already provides a binding.
pyside6 = ["PySide6-Essentials>=6.6"]
pyqt6 = ["PyQt6>=6.6"]
pyqt5 = ["PyQt5>=5.15"]
pyside2 = ["PySide2>=5.15"]
# Optional integration used by the VTK/PyVista tools.
vtk = ["pyvista"]

[project.scripts]
qtpy-mcp = "qtpy_mcp.server.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/qtpy_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE-*", "NOTICE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/qtpy_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/qtpy_mcp/_qtpy_mcp_probe.pth" = "qtpy_mcp_probe.pth"

# ---------------------------------------------------------------- ruff
[tool.ruff]
extend-exclude = ["stubs"]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PT", "A", "T20", "PERF", "RET"]
ignore = [
    "B008",    # FastMCP-style defaults
    "SIM105",  # explicit try/except/pass is clearer in Qt teardown code
    "RUF012",  # mutable class attrs are fine here
    "RET505",
    "PERF203",  # try/except in loops is deliberate (per-widget tolerance)
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT018", "E402"]
"src/qtpy_mcp/server/mcp_server.py" = ["A002"]  # `format` is a public tool argument
"src/qtpy_mcp/probe/screenshotter.py" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["qtpy_mcp"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = "stubs"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# VTK/PyVista ship no type information: everything from them is Any.
# Qt.py has none either, so permissive local stubs live in ./stubs/Qt.
module = ["vtk", "vtk.*", "vtkmodules", "vtkmodules.*", "pyvista", "pyvista.*", "pyvistaqt", "pyvistaqt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests inherited from upstream qt-mcp, ported to Qt.py but not yet fully annotated.
# New test modules are held to the full strict settings.
module = [
    "tests.conftest", "tests.test_api_inspector", "tests.test_auto_install", "tests.test_batch",
    "tests.test_interactor", "tests.test_introspector", "tests.test_layout_inspector",
    "tests.test_qt_messages", "tests.test_qt_shim", "tests.test_ref_registry",
    "tests.test_rpc_server", "tests.test_scene_inspector", "tests.test_screenshotter",
    "tests.test_thread_inspector", "tests.test_widget_details_layout", "tests.integration.*", "tests.fixtures.*",
    "conftest", "test_api_inspector", "test_auto_install", "test_batch", "test_interactor",
    "test_introspector", "test_layout_inspector", "test_qt_messages", "test_qt_shim",
    "test_ref_registry", "test_rpc_server", "test_scene_inspector", "test_screenshotter",
    "test_thread_inspector", "test_widget_details_layout",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["attr-defined", "valid-type", "union-attr", "var-annotated", "no-any-return", "unused-ignore"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_socket: requires socket creation support",
    "qt: needs a working Qt binding",
]

[tool.coverage.run]
source = ["qtpy_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
